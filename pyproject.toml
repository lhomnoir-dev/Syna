[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syna"
version = "0.1.0"
description = "Syna — assistant de recherche Telegram connecté à un vault Obsidian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.0,<23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic>=2.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
syna = "syna.main:main"

[tool.setuptools.packages.find]
include = ["syna*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM905"]
